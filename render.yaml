services:
  - type: web
    name: my-frontier-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 60
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_SECRET
        sync: false
      - key: ENV
        value: production
